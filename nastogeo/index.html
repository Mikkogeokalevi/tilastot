<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nastogeo-pohjat — esikatselu</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1a1a1a;
    font-family: Verdana, Geneva, sans-serif;
    color: #f0f0f0;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: #111111;
    border-bottom: 2px solid #ff8800;
  }
  header label {
    color: #ff8800;
    font-weight: bold;
    font-size: 14px;
  }
  select {
    background: #222222;
    color: #f0f0f0;
    border: 1px solid #ff8800;
    border-radius: 6px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: #1a1a1a;
  }
</style>
</head>
<body>
<header>
  <label for="pohja">Valitse pohja:</label>
  <select id="pohja">
    <option value="tradi_01.html">Tradi 01 — Päivän ensimmäinen</option>
    <option value="multi_01.html">Multi 01 — Muistomerkkien matka</option>
    <option value="mysteeri_01.html">Mysteeri 01 — Eksynyt kirje</option>
    <option value="wherigo_01.html">Wherigo 01 — Kuuma ja kylmä</option>
    <option value="letter_01.html">Letter 01 — Dartmoorin perinne</option>
  </select>
</header>
<iframe id="frame" src="tradi_01.html"></iframe>
<script>
  document.getElementById('pohja').addEventListener('change', function () {
    document.getElementById('frame').src = this.value;
  });
</script>
</body>
</html>

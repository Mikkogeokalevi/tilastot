<div style="background-color:#111111; background-image:linear-gradient(180deg,#181818,#0d0d0d); border:2px solid #e53935; border-radius:14px; box-shadow:0 0 28px rgba(229,57,53,0.14), 0 8px 24px rgba(0,0,0,0.7); max-width:760px; margin:0 auto; padding:20px;">

    <div style="color:#bbbbbb; font-size:14px; letter-spacing:3px;">— NASTOGEON LETTER —</div>
    <div style="color:#e53935; font-size:28px; font-weight:bold; letter-spacing:1px; margin:8px 0 6px 0; text-shadow:0 0 14px rgba(229,57,53,0.45);">📮 DARTMOORIN PERINNE</div>
    <div style="height:2px; width:180px; margin:0 auto 20px auto; background:linear-gradient(90deg,rgba(229,57,53,0),#e53935,rgba(229,57,53,0));"></div>

    <p style="margin:0 0 14px 0;">Tiesitkö, <font color="#e53935">kätkökollega</font>, että harrastuksemme juuret ulottuvat aina vuoteen <font color="#ffe082">1854</font>? Tuolloin Englannin Dartmoorin kosteikolla retkeilijät alkoivat jättää käyntikorttejaan ja viestejään piilossa olevaan purkkiin — näin syntyi <font color="#e53935">letterboxing</font>, geokätköilyn kunnioitettu esikuva.</p>

    <p style="margin:0 0 14px 0;">Tämä letter-kätkö jatkaa tuota vanhaa perinnettä: rasian sisältä löytyy lokivihon lisäksi oma <font color="#ffe082">leimasin</font>, joka on kätkön sielu. Se <font color="#e53935">ei ole vaihtotavaraa</font> eikä sitä saa koskaan ottaa mukaansa — leimasin jää aina paikoilleen seuraavaa kävijää odottamaan.</p>

    <p style="margin:0 0 14px 0;">Jos sinulla on oma leimasin, ota se rohkeasti mukaan: leimaa kätkön leimasimella oma vihkosi ja jätä oman leimasimesi jälki kätkön <font color="#ffe082">lokivihkoon</font>. Näin perinne jatkuu kädestä käteen, löytäjältä toiselle. Ilman leimasintakin onnistut mainiosti — pelkkä nimimerkki lokissa riittää aivan hyvin.</p>

    <div style="border:1px dashed #ffe082; border-radius:10px; background-color:#151515; padding:14px 18px; margin:6px 0 16px 0; text-align:left;">
      <div style="color:#ffe082; font-weight:bold; text-align:center; font-size:16px; letter-spacing:2px; margin-bottom:10px;">📮 NÄIN LEIMAAT</div>
      <p style="margin:0 0 10px 0;"><font color="#e53935">1.</font> Löydä purkki ja avaa se varovasti — sisältö on herkkää.</p>
      <p style="margin:0 0 10px 0;"><font color="#e53935">2.</font> Leimaa kätkön leimasimella oma vihkosi tai lokikirjasi.</p>
      <p style="margin:0 0 10px 0;"><font color="#e53935">3.</font> Jätä oman leimasimesi jälki kätkön lokivihkoon — jos leimasinta ei ole, riittää nimimerkki.</p>
      <p style="margin:0;"><font color="#e53935">4.</font> Aseta leimasin takaisin purkkiin ja sulje huolellisesti. <font color="#ffe082">Leimasin kuuluu aina kätkölle!</font></p>
    </div>

    <p style="margin:0 0 14px 0;">Piilo itsessään on helppo löytää — tässä kätkössä arvo on pikemminkin <font color="#e53935">perinteessä</font> kuin paikannuksen vaikeudessa. Kun purkki avautuu, saatat kokea ripauksen samaa riemua, jonka Dartmoorin retkeilijät tunsivat toistasataa vuotta sitten.</p>

    <div style="height:2px; width:180px; margin:18px auto 14px auto; background:linear-gradient(90deg,rgba(229,57,53,0),#e53935,rgba(229,57,53,0));"></div>
    <div style="color:#e53935; font-size:20px; font-weight:bold; margin-top:8px; text-shadow:0 0 12px rgba(229,57,53,0.4);">Leimaa ja lähde — perinne jatkuu sinun kauttasi! 📮</div>

  </div>

<script type="text/plain" id="lahde-multi_01.html"><meta charset="UTF-8">

<div style="background-color:#111111; background-image:linear-gradient(180deg,#181818,#0d0d0d); border:2px solid #ff8800; border-radius:14px; box-shadow:0 0 28px rgba(255,136,0,0.14), 0 8px 24px rgba(0,0,0,0.7); max-width:760px; margin:0 auto; padding:20px;">

    <div style="color:#bbbbbb; font-size:14px; letter-spacing:3px;">— NASTOGEON MULTI —</div>
    <div style="color:#ff8800; font-size:28px; font-weight:bold; letter-spacing:1px; margin:8px 0 6px 0; text-shadow:0 0 14px rgba(255,136,0,0.45);">🧭 MUISTOMERKKIEN MATKA</div>
    <div style="height:2px; width:180px; margin:0 auto 20px auto; background:linear-gradient(90deg,rgba(255,136,0,0),#ff8800,rgba(255,136,0,0));"></div>

    <p style="margin:0 0 14px 0;">Tervetuloa pienelle kiertueelle, <font color="#ff8800">kätkökollega</font>! Tämä monivaiheinen kätkö opastaa sinut sellaisten <font color="#ff8800">muistomerkkien</font> ja <font color="#4CAF50">tarinoiden</font> äärelle, joiden ohitse ihmiset kiirehtivät päivittäin pysähtymättä koskaan. Nyt on oiva hetki korjata asia — ja kerätä samalla yksi löytö lisää tilille.</p>

    <p style="margin:0 0 14px 0;">Reitti kulkee kahden havaintopisteen kautta. Kummallakin pysähdyksellä etsit yhden luvun — ei kummajaisia eikä vaikeaa matematiikkaa, vain <font color="#ff8800">tarkkaa katsetta</font>. Lopuksi sijoitat löytämäsi luvut alla olevaan <font color="#4CAF50">laskukaavaan</font>, ja purkin todelliset koordinaatit selviävät kuin itsestään.</p>

    <p style="margin:0 0 14px 0;">Varaudu kävelemään reitillä noin <font color="#ff8800">kilometrin verran</font>. Alkupiste on julkaistuissa koordinaateissa, ja maali on lyhyen matkan päässä — purkki itse on pienehkö <font color="#4CAF50">muovirasia</font> lokikirjoineen.</p>

    <div style="border:1px dashed #4CAF50; border-radius:10px; background-color:#151515; padding:14px 18px; margin:6px 0 16px 0; text-align:left;">
      <div style="color:#4CAF50; font-weight:bold; text-align:center; font-size:16px; letter-spacing:2px; margin-bottom:10px;">🧭 LASKUKAAVA</div>
      <p style="margin:0 0 10px 0;"><font color="#ff8800">Vaihe 1</font> (lähtöpiste): Laske, montako tekstiriviä muistolaatassa on yhteensä. Saamasi luku on <font color="#4CAF50">M</font>.</p>
      <p style="margin:0 0 10px 0;"><font color="#ff8800">Vaihe 2</font>: Jatka koordinaatteihin N 61° 45.123&prime; E 023° 40.456&prime;. Etsi lähistöltä patsaan jalusta ja ota sen vuosiluvun kaksi viimeistä numeroa. Saamasi luku on <font color="#4CAF50">P</font>.</p>
      <p style="margin:0;"><font color="#ff8800">Lopullinen sijainti:</font><br />
      N 61° 46.(M × 100 + P + 5)&prime;<br />
      E 023° 41.(P × 9 + M)&prime;<br />
      <font color="#bbbbbb" size="2">Jos tulos on alle kolminumeroinen, täydennä etunollilla.</font></p>
    </div>

    <p style="margin:0 0 14px 0;">Kun koordinaatit ovat hallussa, viimeinen etappi on lyhyt ja helppokulkuinen. Purkki piiloutuu maaston tarjoamaan <font color="#4CAF50">luonnolliseen suojaan</font> — vilkaise vihjettä vasta, jos olet täysin jumissa. Ja kuten aina: aseta rasia takaisin huolellisesti, jottei se joudu <font color="#ff8800">muukalaisten</font> käsiin.</p>

    <div style="height:2px; width:180px; margin:18px auto 14px auto; background:linear-gradient(90deg,rgba(255,136,0,0),#ff8800,rgba(255,136,0,0));"></div>
    <div style="color:#ff8800; font-size:20px; font-weight:bold; margin-top:8px; text-shadow:0 0 12px rgba(255,136,0,0.4);">Hyvää kiertuetta — luvut palkitsevat tarkan löytäjän! 🧭</div>

  </div>
</div></script>

    <p style="margin:0 0 14px 0;">Pura alla oleva viesti, niin saat selville, minne kirje oli alun perin tarkoitus viedä — ja samalla kätkön todelliset koordinaatit. <font color="#ab47bc">Huomio: kätkö ei ole julkaistuissa koordinaateissa</font>, vaikka ne osoittavatkin aivan oikeaan naapurustoon. Ratkaise siis pulma ensin ja lähde vasta sitten liikkeelle.</p>

    <p style="margin:0 0 14px 0;">No niin, <font color="#4CAF50">kätkökollega</font> — tässä on sitä perinteistä kätköilyä parhaimmillaan! Ei arvoituksia, ei laskukaavoja, ei mutkia matkassa: vain sinä, laite ja rehellinen piilo, joka odottaa löytäjäänsä. Jos kaipaat päivääsi <font color="#ffb300">helppoa hymyä</font>, tämä purkki on tehty juuri sinua varten.</p>

    <p style="margin:0 0 14px 0;">Piilo asustaa <font color="#ffb300">luonnon rauhassa</font>, sopivan kävelymatkan päässä lähimmältä pysäköintipaikalta. Reitti on helppokulkuinen, joten kätkö sopii erinomaisesti myös <font color="#4CAF50">perheen pienimmille löytäjille</font> ja uraansa aloitteleville. Sesonkiaikaan lähistöllä saattaa liikkua uteliaita <font color="#ffb300">muukalaisia</font> — toimi siis huomaamattomasti ja odota tarvittaessa sopivaa hetkeä.</p>

    <p style="margin:0 0 14px 0;">Rasia on <font color="#4CAF50">kestävä muovipurkki</font>, johon mahtuu pieniä vaihtotavaroita ja satunnainen <font color="#ffb300">matkalainen</font>kin. Vaihda tavaraa mieluiten tasan tai yli — niin purkin sisältö pysyy mielenkiintoisena seuraavalle löytäjälle. Oma kynä kannattaa aina olla mukana, vaikka rasissa yksi varalla olisikin!</p>

    <p style="margin:0 0 14px 0;">Tarkkaa vihjettä et tähän tarvitse: luota <font color="#4CAF50">kätkövaistoosi</font> ja vilkaise sinne, mistä purkit yleensä asustavat. Kun löytö on taskussa, muista kirjaantua <font color="#ffb300">lokikirjaan</font> ja asettaa rasia takaisin täsmälleen samaan asentoon kuin se piilossa makasi.</p>

      <p style="margin:0 0 6px 0;"><font color="#26c6da">2.</font> Käynnistä kasetti laitteessasi ja syötä seuraavat lukusarjat, jotka on pyydetty, yksi kerrallaan:</p>
      <p style="margin:0 0 10px 0; text-align:center;"><font color="#ffd54f" size="5"><b>606173, 337610, 204067</b></font></p>

      <p style="margin:0;"><font color="#26c6da">4.</font> Tarkista etäisyytesi kätkölle ja etsi kätkö.</p>

    <p style="margin:0 0 14px 0;">Kyseessä on <font color="#0097a7">käänteinen Wherigo</font> eli reverse wherigo: loppukoordinaatteja ei kerrota missään vaiheessa. Sen sijaan kasetti vastaa ainoastaan yhteen kysymykseen — <font color="#f9a825">miten kaukana</font> maali on. Kävele, mittaa uudelleen ja huomaa, oletko kuumalla vai kylmällä jäljellä. Jokainen mittaus on askel lähemmäs.</p>

    <p style="margin:0 0 14px 0;">Tarvitset matkaan <font color="#0097a7">Wherigo-yhteensopivan</font> laitteen tai sovelluksen — esimerkiksi WhereYouGo Androidille tai Wherigo-sovelluksen iOS:lle. Kasetin latauslinkki ja kolme <font color="#f9a825">käynnistyslukusarjaa</font> löytyvät alla olevasta ohjeboksista. Julkaistut koordinaatit ovat hyvä aloituspaikka, mutta purkki itse ei ole siellä.</p>

      <p style="margin:0 0 6px 0;"><font color="#0097a7">2.</font> Käynnistä kasetti laitteessasi ja syötä seuraavat lukusarjat, jotka on pyydetty, yksi kerrallaan:</p>

    <p style="margin:0 0 14px 0;">Kun <font color="#f9a825">etäisyyslukema</font> käy riittävän pieneksi, silmäile ympäristöä tuttujen piilopaikkojen varalta — purkki on pienehkö <font color="#0097a7">muovirasia</font> lokikirjoineen. Ja muistathan kertoa lokissasi, monellako mittauksella maali löytyi: se on tämän kätkön hauskin tilasto.</p>

<script>
  var sel = document.getElementById('pohja');
  var frame = document.getElementById('frame');
  var koodi = document.getElementById('koodi');

  function paivita() {
    frame.src = sel.value;
    var lohko = document.getElementById('lahde-' + sel.value);
    koodi.value = lohko ? lohko.textContent.replace(/^\s+|\s+$/g, '') : '';
  }
  sel.addEventListener('change', paivita);
  paivita();

  document.getElementById('kopioi').addEventListener('click', function () {
    koodi.focus();
    koodi.select();
    try { document.execCommand('copy'); } catch (e) {}
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(koodi.value).catch(function () {});
    }
    var btn = this;
    var teksti = btn.textContent;
    btn.textContent = '✅ Kopioitu!';
    setTimeout(function () { btn.textContent = teksti; }, 1500);
  });
</script>
